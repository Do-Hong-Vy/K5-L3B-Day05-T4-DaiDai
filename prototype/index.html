<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trợ lý khiếu nại AI</title>
<style>
:root{
  --bg:#f4f1ee; --panel:#ffffff; --ink:#1f1d1b; --muted:#6b655f; --line:#e3ddd6;
  --accent:#e2552b; --accent-soft:#fdebe4;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --warn:#a15c00; --warn-soft:#fff1d6;
  --bad:#b42318; --bad-soft:#fde7e5; --info:#1d4ed8; --info-soft:#e4ecff;
  --grey-soft:#efedeb; --hl:#ffe58a;
  --mk-p:#d6336c; --mk-a:#2457d6;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header.top h1{font-size:15px;margin:0 12px 0 0;font-weight:600}
.seg{display:inline-flex;background:#ffffff1a;border-radius:8px;padding:2px}
.seg button{background:none;border:0;color:#fff;padding:6px 10px;border-radius:6px}
.seg button.on{background:#fff;color:var(--ink);font-weight:600}
.tbtn{background:#ffffff1a;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:6px 10px}
.tbtn.on{background:var(--mk-p);border-color:var(--mk-p)}
.note-mock{font-size:12px;color:#ffffffb0;margin-left:auto}
.guide{background:var(--warn-soft);border-bottom:1px solid #f0d9a8;padding:8px 16px;font-size:13px}
.guide b{color:var(--warn)}
main{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;position:relative}
.pane-h{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pane-h .ttl{font-weight:700}
.screen-tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ai-banner{background:var(--info-soft);padding-right:30px;color:#173a99;font-size:12px;padding:7px 14px;border-bottom:1px solid #cfdcff;position:relative}
.order{margin:10px 12px;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;position:relative}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--grey-soft);display:grid;place-items:center;font-size:22px;flex:none}
.order .meta{flex:1;min-width:0}
.order .nm{font-weight:600}
.small{font-size:12px;color:var(--muted)}
.chat{flex:1;overflow:auto;padding:4px 12px 12px;max-height:620px;min-height:300px}
body.shot .chat{max-height:none;overflow:visible}
.msg{margin:10px 0;max-width:92%;position:relative}
.msg.buyer{margin-left:auto;background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;padding:8px 12px;max-width:80%}
.msg.ai{background:#f7f6f4;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px}
.msg.sys{max-width:100%;text-align:center;font-size:12px;color:var(--muted);background:none}
.msg p{margin:6px 0}
.ai-id{font-size:12px;font-weight:700;color:var(--info);display:flex;align-items:center;gap:6px}
.ai-id::before{content:"AI";background:var(--info);color:#fff;border-radius:4px;padding:0 4px;font-size:10px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;position:relative}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;border:1px solid transparent}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:#f0d9a8}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:#bfe3cf}
.b-bad{background:var(--bad-soft);color:var(--bad);border-color:#f6c5c0}
.b-info{background:var(--info-soft);color:var(--info);border-color:#cfdcff}
.b-grey{background:var(--grey-soft);color:var(--muted);border-color:var(--line)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;position:relative}
.diff .col{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;font-size:13px}
.diff .col h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.diff .col.base{border-color:#bfe3cf;background:#f6fcf8}
.diff .col.base h4{color:var(--ok)}
mark{background:var(--hl);padding:0 2px;border-radius:3px}
.src{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);margin-top:6px;padding-top:4px}
.ev3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;position:relative}
.ev3 .col{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px;background:#fff}
.ev3 .col h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;color:var(--muted)}
.ev3 .ok{color:var(--ok);font-weight:600}
.ev3 .miss{color:var(--bad);font-weight:600}
.slot{border:1.5px dashed #e7a39a;border-radius:6px;padding:4px 6px;margin-top:4px;color:var(--bad);font-size:12px}
.checklist{margin:6px 0;padding:0;list-style:none;position:relative}
.checklist li{padding:4px 0 4px 24px;position:relative}
.checklist li::before{content:"○";position:absolute;left:4px;color:var(--bad);font-weight:700}
.checklist li.done::before{content:"✓";color:var(--ok)}
.l2{font-size:12px;background:var(--grey-soft);border-radius:6px;padding:4px 8px;margin:6px 0;color:var(--muted)}
.actionbar{border-top:1px solid var(--line);background:#fbfaf9;padding:10px 12px;position:relative}
.actionbar .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ab-title{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-weight:600;position:relative}
.btn:hover{border-color:#bdb5ad}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:none;border-style:dashed}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.status div::before{content:"● ";color:var(--ok)}
.status div.wait::before{color:var(--warn)}
.composer{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.composer .line{display:flex;gap:6px}
.composer input{flex:1;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.chip::before{content:"ca lạ · ";color:var(--muted)}
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid var(--line);border-bottom:0;background:var(--grey-soft);padding:7px 12px;border-radius:8px 8px 0 0;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);margin-bottom:-1px}
.rv{padding:14px;display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;position:relative;background:#fff}
.card h3{margin:0 0 6px;font-size:14px}
.flag{background:var(--bad-soft);color:var(--bad);border:1px solid #f6c5c0;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
.lock{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 8px;margin-top:8px}
.held{font-size:13px;background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:6px 10px;font-weight:600}
.forbid{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;position:relative}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--warn)}
.demo-ctl{font-size:12px;border:1px dashed #c9b88f;background:#fffaf0;border-radius:8px;padding:8px 10px}
.demo-ctl b{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.log{grid-column:1/-1}
.log table{width:100%;border-collapse:collapse;font-size:12.5px}
.log th,.log td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.log th{font-size:11px;text-transform:uppercase;color:var(--muted)}
.lv{font-weight:700;font-size:11px;border-radius:4px;padding:1px 6px;white-space:nowrap}
.lv-auto{background:var(--ok-soft);color:var(--ok)}
.lv-appr{background:var(--warn-soft);color:var(--warn)}
.lv-ban{background:var(--bad-soft);color:var(--bad)}
.lv-rule{background:var(--info-soft);color:var(--info)}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--grey-soft);padding:0 4px;border-radius:4px}
.legend{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;font-size:12.5px}
.legend .it{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px}
/* numbered markers */
.mk{display:none;position:absolute;top:-9px;right:-9px;z-index:5;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff,0 2px 6px #0004}
.mk.p{background:var(--mk-p)} .mk.a{background:var(--mk-a)}
.mk.inl{position:static;display:none;flex:none}
body.marks .mk{display:flex}
body.marks .mk.inl{display:inline-flex;vertical-align:middle;margin-left:4px;box-shadow:none}
body.marks .mk-ring{outline:2px dashed var(--mk-p);outline-offset:2px}
body.marks .mk-ring-a{outline:2px dashed var(--mk-a);outline-offset:2px}
.legend .mk{display:flex;position:static;flex:none}
/* modal */
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:18px;position:relative;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px}
.modal > .mk{top:10px;right:10px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:10px;background:var(--warn-soft);padding:8px;border-radius:8px}
</style>
</head>
<body class="marks">
<header class="top">
  <h1>Trò chuyện với Shopee · Trợ lý khiếu nại "không đúng mô tả"</h1>
  <div class="seg" id="caseSeg">
    <button data-act="case" data-v="k1">K1 · Đơn B02 · mô tả bị sửa</button>
    <button data-act="case" data-v="k2">K2 · Đơn C03 · người bán đúng</button>
  </div>
  <button class="tbtn" id="mkBtn" data-act="marks">Số đánh dấu: BẬT</button>
  <button class="tbtn" data-act="reset">↺ Làm lại ca này</button>
  <span class="note-mock">Dữ liệu dựng · hôm nay 13/11/2026 · không có backend</span>
</header>
<div class="guide" id="guide"></div>
<main>
  <section class="pane" id="buyer"></section>
  <section class="pane" id="reviewer"></section>
  <section class="pane log" id="log"></section>
  <section class="legend" id="legend"></section>
</main>
<div id="modalRoot"></div>

<script>
/* ===== Dữ liệu dựng (spec.md §2.0) — không phải dữ liệu thật ===== */
const ORDERS = {
  k1:{id:'B02', name:'Nồi chiên không dầu', price:'1.290.000đ', icon:'🍳', received:'08/11', deadline:'23:59 15/11/2026', left:'còn 2 ngày',
      buyerText:'Nồi chiên ghi 6 lít mà mình đo lòng nồi chỉ được 5 lít. Không đúng mô tả.'},
  k2:{id:'C03', name:'Tai nghe bluetooth', price:'890.000đ', icon:'🎧', received:'11/11', deadline:'23:59 18/11/2026', left:'còn 5 ngày',
      buyerText:'Tai nghe này fake 100%, tem mờ, khác hẳn cái mình thấy ở cửa hàng chính hãng. Hoàn tiền ngay cho mình.'}
};
const fresh = () => ({
  k1:{step:0, msgs:[], log:[], photo:false, seller:null, hours:0, staff:null},
  k2:{step:0, msgs:[], log:[], tem:false, serial:null, seller:null, staff:null}
});
let st = Object.assign({cur:'k1', tab:'seller', marks:true, modal:null}, fresh());
let clock = 48; // phút giả lập, chỉ để log có giờ khác nhau
const C = () => st[st.cur];
const O = () => ORDERS[st.cur];
const mk = (n, t='p', inl=false) => `<span class="mk ${t}${inl?' inl':''}">${n}</span>`;
const t = () => { clock += 1; return `09:${String(clock).padStart(2,'0')}`; };
function log(tool, lv, note){ C().log.push({time:t(), tool, lv, note}); }
function say(who, html){ C().msgs.push({who, html}); }

/* ===== Mẩu giao diện dùng lại ===== */
const diffCard = () => `
<div class="diff mk-ring">${mk(2)}
  <div class="col base"><h4>Mô tả lúc đặt · snapshot 03/11</h4>"Nồi chiên không dầu <b>dung tích 6 lít</b>"<div class="src">Căn cứ so sánh (Luật L1)</div></div>
  <div class="col"><h4>Mô tả hiện tại · sửa 09/11</h4>"Nồi chiên không dầu 6 lít <mark>(dung tích tổng), lòng nồi 5 lít</mark>"<div class="src">Shop sửa <b>sau khi bán</b> → không dùng để bác khiếu nại</div></div>
</div>`;

function ev3(viewer){
  const c = st.k2;
  const sellerCol = c.seller==='evidence'
    ? `<span class="ok">Đã nộp · khớp mô tả</span><br>• Hoá đơn nhập từ nhà phân phối<br>• Ảnh quét QR → serial <b>SN-884920</b> = serial in trên hộp`
    : `<span class="small">Chưa phản hồi (còn 48 giờ)</span>`;
  let serialLine;
  if (c.serial==='match') serialLine = `<span class="ok">✓ Serial thân máy SN-884920 = hộp</span>`;
  else if (c.serial==='mismatch') serialLine = `<span class="miss">⚠ Serial thân máy SN-111111 ≠ hộp SN-884920</span>`;
  else serialLine = `<div class="slot">Còn thiếu: ảnh serial trên thân tai nghe đặt cạnh vỏ hộp</div>`;
  const temLine = c.tem ? `<span class="ok">✓ Ảnh tem cận cảnh</span>` : `<div class="slot">Còn thiếu: ảnh tem bảo hành cận cảnh</div>`;
  return `
<div class="ev3 mk-ring">${mk(2)}
  <div class="col"><h4>Mô tả lúc đặt</h4>"Hàng phân phối chính thức, <b>tem bảo hành nhà phân phối, mã QR tra cứu serial</b>"</div>
  <div class="col"><h4>Bằng chứng người bán</h4>${sellerCol}</div>
  <div class="col"><h4>Bằng chứng người mua</h4>Phản ánh: "tem mờ, khác hàng ở cửa hàng" <span class="badge b-grey">nhận định · không tính là căn cứ (L2)</span><br>${temLine}<br>${serialLine}</div>
</div>`;
}

/* ===== Hành động ===== */
const A = {
  case(v){ st.cur=v; st.modal=null; },
  marks(){ st.marks=!st.marks; },
  tab(v){ st.tab=v; },
  reset(){ st[st.cur]=fresh()[st.cur]; st.modal=null; },
  close(){ st.modal=null; },

  /* ---------- K1 ---------- */
  k1_send(){ const c=st.k1; if(c.step) return; c.step=1;
    say('buyer', O().buyerText);
    log('xem_don_va_mo_ta_luc_dat','auto','Đọc đơn B02: snapshot 03/11 "dung tích 6 lít" ≠ mô tả hiện tại (sửa 09/11). Hạn trả 15/11, còn 2 ngày.');
    log('Luật L1','rule','Snapshot khác bản hiện tại → so với snapshot, hiện cả hai bản, bắt buộc chuyển nhân viên.');
    say('ai', `<div class="ai-id">Trợ lý AI của Shopee</div>
<div class="badges mk-ring">${mk(1)}<span class="badge b-warn">Phát hiện lệch phiên bản mô tả · khớp log hệ thống 100%</span><span class="badge b-ok">Hạn trả hàng: còn 2 ngày (15/11)</span><span class="badge b-grey">Kết luận đúng/sai mô tả: nhân viên duyệt</span></div>
<p>Chào bạn, mình là <b>Trợ lý AI của Shopee</b>. Mình đã kiểm tra đơn <b>#B02 (Nồi chiên không dầu · 1.290.000đ)</b>. Thời hạn gửi yêu cầu trả hàng của đơn này đến <b>23:59 ngày 15/11/2026 (còn 2 ngày)</b>.</p>
<p>Qua đối chiếu dữ liệu lưu trữ, mình phát hiện <b>mô tả lúc bạn đặt hàng (03/11)</b> ghi <i>'Nồi chiên không dầu dung tích 6 lít'</i>, trong khi <b>mô tả hiện tại</b> đã được shop chỉnh sửa vào ngày <b>09/11 (sau khi giao hàng)</b>:</p>
${diffCard()}
<p>Vì mô tả sản phẩm đã thay đổi sau thời điểm đặt hàng, mình <b>không tự kết luận đóng khiếu nại và không tự chi hoàn tiền ngay</b>. Bạn xác nhận muốn <b>tạo yêu cầu trả hàng hoàn tiền (1.290.000đ)</b> cho đơn #B02 để mình <b>khóa mốc thời hạn hôm nay</b> và chuyển hồ sơ ưu tiên cho nhân viên Shopee xử lý nhé?</p>`);
  },
  k1_confirm(){ const c=st.k1; if(!(c.step===1||c.step==='fb'||c.step==='undone')) return;
    c.step=2;
    say('buyer','✔ Xác nhận trả hàng hoàn tiền');
    log('Luật L7','rule','Người mua xác nhận muốn trả hàng hoàn tiền (không chỉ phản ánh).');
    log('soan_de_xuat_hoan_tien','auto','Tạo bản NHÁP hồ sơ (snapshot 03/11 + mô tả 09/11 + lời khiếu nại). Không chuyển tiền. Huỷ được.');
    log('chuyen_truong_nhom','auto','Bắt buộc theo điều kiện (a) — cờ ưu tiên "Mô tả sửa sau khi bán". Xem trong 24h sau hạn phản hồi của shop.');
    log('Thông báo người bán','auto','Gửi yêu cầu trả hàng #B02 tới Kênh Người Bán · 48 giờ phản hồi (đến 09:50 15/11).');
    say('ai', `<div class="ai-id">Trợ lý AI của Shopee</div>
<div class="badges"><span class="badge b-ok">Đã ghi nhận trong hạn · 09:50 13/11</span><span class="badge b-info">Đã chuyển Trưởng nhóm · cờ ưu tiên</span></div>
<p>Mình đã <b>ghi nhận yêu cầu trả hàng trong hạn</b> cho đơn <b>#B02</b> (lúc 09:50 ngày 13/11/2026 — quyền trả hàng của bạn đã được bảo lưu, không bị ảnh hưởng dù quá trình xét duyệt qua ngày 15/11). Mình đã soạn sẵn hồ sơ đính kèm <b>bản chụp mô tả lúc đặt (03/11)</b> và chuyển ưu tiên cho <b>Trưởng nhóm xử lý khiếu nại Shopee</b>.</p>
<p><b>Bước tiếp theo &amp; thời gian xử lý:</b></p>
<p>• Người bán có tối đa <b>48 giờ</b> (đến <b>09:50 ngày 15/11</b>) để bấm <i>'Đồng ý trả hàng'</i> (nếu shop bấm đồng ý, bạn được hướng dẫn gửi trả nồi ngay mà không cần chờ thêm).<br>• Nếu người bán không đồng ý hoặc hết 48 giờ không phản hồi, <b>nhân viên Shopee sẽ duyệt hồ sơ trong vòng 24 giờ tiếp theo</b>. Trong suốt thời gian này, khoản tiền <b>1.290.000đ vẫn được giữ an toàn tại sàn</b>.</p>`);
  },
  k1_feedback(){ const c=st.k1; if(c.step!==1) return; c.step='fb';
    say('buyer','Chỉ gửi phản ánh, mình giữ hàng');

    if(c.step===2 && !c.staff && c.seller!=='agree') return '<b>Bước 4/4</b> · Ở tab <b>Nhân viên sàn</b>, nút đã mở khoá → bấm duyệt, xem hộp xác nhận.';
    return 'Xong ca K1. Bấm <b>↺ Làm lại ca này</b> hoặc chuyển sang <b>K2</b>.';
  }
  if(c.step===0) return '<b>Bước 1/4</b> · Ở màn hình Người mua, bấm <b>Gửi</b> để gửi khiếu nại "fake 100%".';
  if(c.step===1) return '<b>Bước 2/4</b> · AI xin đúng 2 ảnh còn thiếu (số 3). Bấm <b>Xác nhận tạo yêu cầu trả hàng</b>.';
  if(c.step===2 && !c.seller) return '<b>Bước 3/4</b> · Sang tab <b>Người bán</b>, bấm <b>Gửi chứng từ</b> (hoá đơn + QR khớp).';
  if(c.step===2 && !c.staff && c.seller!=='agree') return '<b>Bước 4/4</b> · Xem bảng 3 cột (số 2) ở cả hai màn hình. Sang tab <b>Nhân viên sàn</b> để duyệt.';
  return 'Xong ca K2. Bấm <b>↺ Làm lại ca này</b> hoặc chuyển sang <b>K1</b>.';
}

    it(mk(2),'[#2] HAX G11 · PAIR Explainability + Trust','Thẻ 2 bản mô tả (K1) · bảng 3 cột bằng chứng (K2), cùng một thẻ ở màn hình người mua và người duyệt.'),
    it(mk(3),'[#3] HAX G10 + G8/G9 · PAIR Errors','Thanh hành động: hỏi xác nhận 1 câu (L7), danh sách đúng ảnh còn thiếu (L4), hoàn tác, trạng thái chuyển người.'),
    it(mk('A','a'),'Tự làm → có hoàn tác','Nút "Huỷ yêu cầu / Hoàn tác nháp" huỷ bản nháp soan_de_xuat_hoan_tien.'),
    it(mk('B','a'),'Cần duyệt → có xác nhận','Người mua xác nhận tạo yêu cầu; chi_hoan_tien / tu_choi_khieu_nai chỉ ở màn hình người duyệt, có hộp xác nhận, khoá theo L3.'),
    it(mk('C','a'),'Có đường chuyển người','"Gặp nhân viên" + trạng thái chuyen_truong_nhom kèm SLA 24h.'),
    it(mk('D','a'),'Việc cấm → không có nút','Không có nút phạt/khoá shop ở bất kỳ màn hình nào; bấm "Khoá shop này đi" → AI chuyển Bộ phận chuyên trách.')
  ].join('');
}

function renderModal(){
  const m=st.modal; if(!m) return '';
  const box=(title, body, act, label, cls='primary', need=false)=>`<div class="ov"><div class="modal">${mk('B','a')}<h3>${title}</h3>${body}
    ${need?`<label class="chk"><input type="checkbox" data-act="modal_check" ${m.checked?'checked':''}> <span>Tôi đã xem mô tả lúc đặt và bằng chứng của <b>cả hai bên</b>, và hiểu thao tác này <b>khó đảo lại</b>.</span></label>`:''}
    <div class="row"><button class="btn" data-act="close">Quay lại</button><button class="btn ${cls}" data-act="${act}" ${need&&!m.checked?'disabled':''}>${label}</button></div></div></div>`;
  const sum = (amount, who) => `<div class="small">Khó đảo: tiền đã về ${who} thì rất khó đòi lại. Số tiền: <b>${amount}</b>.</div>`;
  switch(m.kind){
    case 'k1_seller_agree': return box('Đồng ý trả hàng hoàn tiền đơn #B02?', `<p>Người mua gửi trả nồi; <b>1.290.000đ</b> sẽ được hoàn cho người mua theo luồng trả hàng chuẩn.</p>${sum('1.290.000đ','người mua')}`, 'k1_seller_agree','Đồng ý trả hàng','ok');
    case 'k1_staff_refund': return box('Duyệt chi hoàn tiền 1.290.000đ?', `${diffCard()}<p>Căn cứ: snapshot 03/11. Shop: ${st.k1.seller==='disagree'?'đã phản hồi không đồng ý':'không phản hồi trong 48 giờ'}.</p>${sum('1.290.000đ','người mua')}`, 'k1_staff_refund','Duyệt chi hoàn tiền','ok', true);
    case 'k1_staff_reject': return box('Từ chối khiếu nại đơn #B02?', `<div class="flag">⚠ Mô tả đã bị sửa sau khi bán. Nếu từ chối dựa trên mô tả hiện tại (09/11) là sai Luật L1.</div>${diffCard()}${sum('1.290.000đ','người bán')}`, 'k1_staff_reject','Từ chối khiếu nại','danger', true);
    case 'k2_seller_agree': return box('Đồng ý trả hàng hoàn tiền đơn #C03?', `<p>890.000đ sẽ được hoàn cho người mua sau khi họ gửi trả tai nghe.</p>${sum('890.000đ','người mua')}`, 'k2_seller_agree','Đồng ý trả hàng','ok');
    case 'k2_staff_refund': return box('Duyệt chi hoàn tiền 890.000đ?', `${ev3()}${sum('890.000đ','người mua')}`, 'k2_staff_refund','Duyệt chi hoàn tiền','ok', true);
    case 'k2_staff_reject': return box('Từ chối khiếu nại — giải ngân 890.000đ cho shop?', `${ev3()}<p class="small">Người mua đã được báo cụ thể còn thiếu gì (L4). ${st.k2.serial==='mismatch'?'<b style="color:var(--bad)">Lưu ý: serial thân máy khác hộp.</b>':''}</p>${sum('890.000đ','người bán')}`, 'k2_staff_reject','Từ chối khiếu nại','danger', true);
  }
  return '';
}

function render(){
  document.body.classList.toggle('marks', st.marks);
  document.getElementById('mkBtn').textContent = 'Số đánh dấu: ' + (st.marks?'BẬT':'TẮT');
  document.getElementById('mkBtn').classList.toggle('on', st.marks);
  document.querySelectorAll('#caseSeg button').forEach(b=>b.classList.toggle('on', b.dataset.v===st.cur));
  document.getElementById('guide').innerHTML = guideText();
  document.getElementById('buyer').innerHTML = renderBuyer();
  document.getElementById('reviewer').innerHTML = renderReviewer();
  document.getElementById('log').innerHTML = renderLog();
  document.getElementById('legend').innerHTML = renderLegend();
  document.getElementById('modalRoot').innerHTML = renderModal();
  const chat=document.getElementById('chat'); if(chat) chat.scrollTop=chat.scrollHeight;
}

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn=A[el.dataset.act]; if(!fn) return;
  if(el.type==='checkbox') e.preventDefault();
  fn(el.dataset.v); render();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && st.modal){ st.modal=null; render(); } });

/* ===== Chế độ chụp ảnh: ?shot=k1 | k2 | k1modal (dựng sẵn trạng thái để chụp ảnh đánh số) ===== */
(function(){
  const shot = new URLSearchParams(location.search).get('shot');
  if(shot){ document.body.classList.add('shot');
    if(shot==='k1'){ st.cur='k1'; A.k1_send(); A.k1_confirm(); st.tab='staff'; }
    if(shot==='k2'){ st.cur='k2'; A.k2_send(); A.k2_confirm(); A.k2_seller_evidence(); st.tab='staff'; }
    if(shot==='k1modal'){ st.cur='k1'; A.k1_send(); A.k1_confirm(); A.k1_skip48(); st.tab='staff'; A.k1_staff_reject_ask(); }
  }
  render();
})();
</script>
</body>
</html>
